version: '3.9'

services:
  openwrt:
    image: openwrtorg/rootfs:x86-64 # 替换为你自己的OpenWrt镜像
    container_name: openwrt
    privileged: true  # 通常OpenWrt需要特权模式运行
    networks:
      macvlan_net:
        ipv4_address: 192.168.1.35  # 替换为你的局域网IP段内地址
    restart: always

networks:
  macvlan_net:
    driver: macvlan
    driver_opts:
      parent: eth0  # 替换为你的宿主机物理网卡名
    ipam:
      config:
        - subnet: 192.168.1.0/24   # 替换为你局域网的网段
          gateway: 192.168.1.1     # 替换为你局域网的网关
