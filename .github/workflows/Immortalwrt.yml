
name: Immortalwrt Build

on: 
  # push: 
  #   branches:
  #     - master
  #schedule:
  #  - cron: 30 18 * * *
  workflow_dispatch:
    inputs:
      setup_tmate:
        description: "是否启用 tmate 调试会话"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  CONFIG_FILE: 111.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: deploy to staging
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
        genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf \
        python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
        swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        
    - name: 下载源代码
      run: |
        git clone https://github.com/immortalwrt/immortalwrt

    - name: Free up disk space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/dl /mnt/openwrt/staging_dir /mnt/openwrt/build_dir
        ln -sf /mnt/openwrt/dl immortalwrt/dl
        ln -sf /mnt/openwrt/staging_dir immortalwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir immortalwrt/build_dir

    - name: Cache
      uses: stupidloud/cachewrtbuild@main
      with:
          ccache: 'true'
          mixkey: 'rootf'
          prefix: 'immortalwrt'

    - name: Load custom feeds
      run: |
        # [ -e $FEEDS_CONF ] && mv $FEEDS_CONF immortalwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd immortalwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: |
        cd immortalwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        # [ -e files ] && mv files openwrt/files
        # [ -e $CONFIG_FILE ] && mv $CONFIG_FILE immortalwrt/.config
        chmod +x $DIY_P2_SH
        cd immortalwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
    - name: Setup tmate session
      if: ${{ inputs.setup_tmate == 'true' }}
      uses: mxschmitt/action-tmate@v3

    - name: 复制仓库配置
      if: ${{ inputs.setup_tmate == 'false' }}
      run: |
        sudo cp "${{ github.workspace }}/$CONFIG_FILE" ./immortalwrt/.config

    - name: 准备配置文件
      run: |
        mkdir -p upload
        cp ./immortalwrt/.config ./upload/config.txt
        cd upload
        echo "CONFIG=$PWD" >> $GITHUB_ENV

    - name: Upload config
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt_firmware_${{ env.FILE_DATE }}_config
        path: ${{ env.CONFIG }}
        
    - name: 下载 dl 库，编译固件 （-j 后面是线程数，第一次编译推荐用单线程）
      run: |
        cd immortalwrt
        sudo chmod -R 777 .
        make defconfig
        make download -j8
        make -j$(nproc) || make -j1 || make -j1 V=s
        cd bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt_firmware_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

        
